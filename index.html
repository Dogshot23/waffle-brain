<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WaffleBrain — Teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/favicon.ico">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="theme-color" content="#F7F6F3">
<style>
  /* ── Prompt text formatting ──────────────── */
  #prompt-text p.prompt-intro            { margin: 0 0 0.45em; }
  #prompt-text p.prompt-intro:last-child { margin-bottom: 0; }
  #prompt-text .prompt-section           { display: block; font-size: 0.72em; font-weight: 700;
                                           text-transform: uppercase; letter-spacing: 0.06em;
                                           opacity: 0.5; margin: 0.75em 0 0.25em; }
  #prompt-text .prompt-section:first-child { margin-top: 0.2em; }
  #prompt-text .prompt-list              { margin: 0 0 0.2em; padding-left: 1.2em;
                                           list-style: disc; }
  #prompt-text .prompt-list li           { margin-bottom: 0.15em; line-height: 1.4; }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo-group">
      <img src="images/logo.png" alt="WaffleBrain" class="logo-img">
      <span class="logo-subtitle">For teachers</span>
    </div>
    <span class="collection-name" id="collection-name">General English</span>
    <nav class="version-nav" aria-label="Switch version">
      <a href="index.html"   class="version-link active"   aria-current="page">Teacher</a>
      <a href="student.html" class="version-link inactive">Student</a>
    </nav>
  </header>

  <div class="waffle-select" id="waffle-select">
    <button type="button" class="waffle-trigger" id="waffle-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose Waffle">
      <span class="waffle-trigger-icon" id="waffle-trigger-icon" aria-hidden="true">🧇</span>
      <span class="waffle-trigger-label" id="waffle-trigger-label">General English</span>
      <svg class="waffle-trigger-chevron" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <ul class="waffle-list" id="waffle-list" role="listbox" aria-label="Waffle" hidden></ul>
  </div>

  <div class="selector-bar">
    <select id="level-select" aria-label="Student level">
      <option value="A1A2" selected>Beginner (A1/A2)</option>
      <option value="B1">Intermediate (B1)</option>
      <option value="B2+">Advanced (B2+)</option>
    </select>
    <select id="category-select" aria-label="Filter by category">
      <option value="">All Categories</option>
      <option value="Everyday Situations">Everyday Situations</option>
      <option value="Simple Roleplay">Simple Roleplay</option>
      <option value="Describe">Describe</option>
      <option value="Choose and Create">Choose and Create</option>
      <option value="Explain and Show">Explain and Show</option>
      <option value="Guided Stories">Guided Stories</option>
    </select>
  </div>

  <div id="prompt-card">
    <span class="mode-badge" id="mode-label">Loading</span>
    <div id="prompt-text"></div>
    <div class="divider"></div>
    <div class="constraint-block">
      <span class="constraint-label">Language Focus</span>
      <p id="constraint-text"></p>
    </div>
    <button id="copy-btn" aria-label="Copy for student">
      <svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="4" y="4" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="1.2"/>
        <path d="M8 4V2.8A.8.8 0 0 0 7.2 2H1.8A.8.8 0 0 0 1 2.8v5.4c0 .44.36.8.8.8H4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      Copy for student
    </button>
  </div>

  <div class="btn-wrap">
    <button id="back-btn" disabled aria-label="Go to previous prompt">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M13 8H3M7 4L3 8l4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="next-btn" disabled>
      Next prompt
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <footer>Press <kbd>Space</kbd> for next prompt</footer>

</div>

<script src="collections.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
